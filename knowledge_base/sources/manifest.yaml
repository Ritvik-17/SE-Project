# Official regulatory and standards documents for the knowledge base (problem statement step 5).
#
# How to add one:
#   1. Download the document from the official source (source_url is the landing page; find the current version).
#   2. Save it in this folder under `file`.
#   3. Fill in `version` and `effective_from` FROM THE DOCUMENT ITSELF (they are left empty on purpose).
#   4. Run:  .venv\Scripts\python -m app.kb.seed --sources        (add --approve-as compliance_legal to activate)
# Entries without a file, version or effective date are skipped and listed as pending.
#
# Scope: the two active use cases (loan processing, customer onboarding/KYC), India first.

documents:
  # ---------------- India: regulation ----------------
  - doc_key: rbi-digital-lending-directions
    collection: regulation
    title: RBI Digital Lending Directions
    issuer: Reserve Bank of India
    source_url: https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx
    license: full_text
    jurisdictions: [IN]
    applicability: {domains: [loan_processing], entity_types: [bank, nbfc]}
    file: rbi-digital-lending-directions.pdf
    version: null
    effective_from: null

  - doc_key: rbi-fair-practices-code-lenders
